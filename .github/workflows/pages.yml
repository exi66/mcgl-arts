# Publishes the site to GitHub Pages — only after CI passes. Triggers: a version tag (v*, code changes) or a push to main
# that touches the artworks (a new picture goes live without a release).
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
    branches: [main]
    # GitHub does not apply path filters to tag pushes: every v* tag deploys.
    paths: ['src/assets/artworks/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only when registry.json exists (the starter itself): the theme registry → public/r → dist/r.
      - if: hashFiles('registry.json') != ''
        run: pnpm registry:build

      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
